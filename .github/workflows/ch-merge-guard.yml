name: CH merge guard

# This definition is loaded from the default branch, not the candidate PR.
# The bootstrap PR is reviewed/tested normally; this starts after it is merged.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: ch-evidence-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  capture:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install reviewed evaluator and test dependencies
        run: |
          python -m venv "$RUNNER_TEMP/ch-env"
          "$RUNNER_TEMP/ch-env/bin/python" -m pip install -r control/.github/ch-requirements.txt
          "$RUNNER_TEMP/ch-env/bin/python" -m pip install --no-deps -e ./control
      - name: Capture candidate tests without write credentials or shared caches
        env:
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_REMOTE: https://github.com/${{ github.repository }}
        run: |
          export PATH="$RUNNER_TEMP/ch-env/bin:$PATH"
          python control/scripts/ch_merge_guard.py capture \
            --policy control/.github/ch-merge-policy.json \
            --repo candidate --expected-commit "$EXPECTED_COMMIT" \
            --expected-remote "$EXPECTED_REMOTE" --output "$RUNNER_TEMP/ch-capture"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ch-capture
          path: ${{ runner.temp }}/ch-capture/receipt
          if-no-files-found: error
          retention-days: 30

  verify:
    if: always() && github.event.workflow_run.event == 'pull_request'
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      # Candidate files are measured as bytes here. They are never installed or run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install reviewed evaluator only
        run: |
          python -m venv "$RUNNER_TEMP/ch-env"
          "$RUNNER_TEMP/ch-env/bin/python" -m pip install -r control/.github/ch-requirements.txt
          "$RUNNER_TEMP/ch-env/bin/python" -m pip install --no-deps -e ./control
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: ch-capture
          path: ${{ runner.temp }}/ch-incoming
      - name: Independently verify, evaluate controls and export
        id: guard
        continue-on-error: true
        env:
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_REMOTE: https://github.com/${{ github.repository }}
          CAPTURE_RESULT: ${{ needs.capture.result }}
        run: |
          test "$CAPTURE_RESULT" = success
          "$RUNNER_TEMP/ch-env/bin/python" control/scripts/ch_merge_guard.py check \
            --policy control/.github/ch-merge-policy.json \
            --repo candidate --expected-commit "$EXPECTED_COMMIT" \
            --expected-remote "$EXPECTED_REMOTE" --receipt "$RUNNER_TEMP/ch-incoming" \
            --output "$RUNNER_TEMP/ch-verdict"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        continue-on-error: true
        with:
          name: ch-evidence-bundle
          path: ${{ runner.temp }}/ch-verdict
          if-no-files-found: warn
          retention-days: 30
      - name: Publish required check on the candidate SHA
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          CAPTURE_RESULT: ${{ needs.capture.result }}
        with:
          script: |
            const run = context.payload.workflow_run;
            const ok = process.env.GUARD_OUTCOME === 'success' && process.env.CAPTURE_RESULT === 'success';
            await github.rest.checks.create({
              ...context.repo, name: 'CH evidence', head_sha: run.head_sha,
              status: 'completed', conclusion: ok ? 'success' : 'failure',
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              output: {
                title: ok ? 'Reviewed policy and seven gates passed' : 'Evidence missing, failing or unsupported',
                summary: ok
                  ? 'Receipt/source verification, reviewed regression policy, seven gates and both negative controls passed. Runner-reported evidence; warrant remains separate. Artifacts expire after 30 days.'
                  : 'Merge is not accepted. Inspect capture/verification logs. A failed CI run, absent receipt, unsupported fork, unexpected skip, stale commit or incomplete gate run cannot pass.'
              }
            });
            if (!ok) core.setFailed('CH evidence did not pass');
