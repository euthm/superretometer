name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Check website and README package metadata
        run: python3 scripts/sync_site_metadata.py --check

      - name: Run test suite
        run: python3 -m pytest tests/ -v

      - name: Run examples
        run: |
          PYTHONPATH=. python3 examples/minimal/run.py
          PYTHONPATH=. python3 examples/structural_engineering/run.py
          PYTHONPATH=. python3 examples/engineering_model/run.py
