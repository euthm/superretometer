[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-harness"
version = "0.7.1"
description = "Structured engineering reasoning, provenance, epistemic warrant, and change-impact analysis over a knowledge graph"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Egil Utheim"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
superretometer = "cognitive_harness.cli:main"

[project.optional-dependencies]
# The [mcp] extra is kept for compatibility but is no longer needed.
# The MCP server is included in the base package and uses no external deps.
mcp = []
evidence = ["jsonschema>=4.18"]
dev = [
    "pytest>=7.0",
    "requests>=2.28",
    "jsonschema>=4.18",
]

[tool.setuptools.packages.find]
include = ["cognitive_harness*", "transports*"]

[tool.setuptools.package-data]
"cognitive_harness.evidence" = ["schemas/*.json"]

[tool.pytest.ini_options]
markers = ["live_memory: opt-in tests that write to an explicitly selected Memory project"]
